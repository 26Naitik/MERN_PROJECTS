<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">

        <h1>Food Corner Restaurant</h1>

        <div class="box drink">

            <div class="title">
                <h2>Soft Drink</h2>
            </div>

            <div class="content">
                <p>
                    Fresh and chilled drinks.<br>
                    Perfect for every meal.
                </p>
            </div>

        </div>

        <div class="box pizza">

            <div class="title">
                <h2>Pizza</h2>
            </div>

            <div class="content">
                <p>
                    Cheesy and delicious pizza.<br>
                    Loaded with fresh toppings.
                </p>
            </div>

        </div>

        <div class="box burger">

            <div class="title">
                <h2>Burger</h2>
            </div>

            <div class="content">
                <p>
                    Crispy and juicy burger.<br>
                    Served with fresh veggies.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
